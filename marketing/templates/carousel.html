<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #1a2e28;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(7, 22, 18, 0.78) 0%,
        rgba(7, 22, 18, 0.35) 42%,
        rgba(7, 22, 18, 0.12) 70%,
        rgba(7, 22, 18, 0) 100%
      );
    }
    .brand {
      position: absolute;
      top: 64px;
      left: 72px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 2;
    }
    .brand img {
      height: 64px;
      width: auto;
      display: block;
    }
    .brand span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .content {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 88px;
      z-index: 2;
      color: #ffffff;
    }
    .eyebrow {
      font-family: Inter, sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: #7fd4ae;
      margin-bottom: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 64px;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      max-width: 900px;
    }
    .body {
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
      max-width: 880px;
    }
    .cta-box {
      margin-top: 28px;
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px 28px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(8px);
    }
    .cta-box strong {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 36px;
      font-weight: 700;
    }
    .cta-box span {
      font-family: Inter, sans-serif;
      font-size: 26px;
      color: #7fd4ae;
    }
    .pager {
      position: absolute;
      top: 78px;
      right: 72px;
      z-index: 2;
      font-family: Inter, sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>
  <div class="slide">
    <img class="bg" id="bg" src="" alt="" />
    <div class="overlay"></div>
    <div class="brand">
      <img id="logo" src="" alt="" />
      <span>Guia de Bolso</span>
    </div>
    <div class="pager" id="pager"></div>
    <div class="content">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="title" id="title"></h1>
      <p class="body" id="body"></p>
      <div class="cta-box" id="cta" style="display:none">
        <strong>Baixe o Guia de Bolso</strong>
        <span>guiadebolso.app</span>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('bg').src = params.get('bg') || '';
    document.getElementById('logo').src = params.get('logo') || '';
    document.getElementById('eyebrow').textContent = params.get('eyebrow') || '';
    document.getElementById('title').textContent = params.get('title') || '';
    document.getElementById('body').textContent = params.get('body') || '';
    const page = params.get('page');
    const total = params.get('total');
    if (page && total) document.getElementById('pager').textContent = `${page}/${total}`;
    if (params.get('cta') === '1') document.getElementById('cta').style.display = 'inline-flex';
    if (!params.get('eyebrow')) document.getElementById('eyebrow').style.display = 'none';
  </script>
</body>
</html>
