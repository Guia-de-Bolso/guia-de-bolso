<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    .slide {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #1a2e28;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(7, 22, 18, 0.82) 0%,
        rgba(7, 22, 18, 0.4) 45%,
        rgba(7, 22, 18, 0.15) 72%,
        rgba(7, 22, 18, 0.08) 100%
      );
    }
    .brand {
      position: absolute;
      top: 260px;
      left: 72px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 2;
    }
    .brand img {
      height: 72px;
      width: auto;
      display: block;
    }
    .brand span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .content {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 320px;
      z-index: 2;
      color: #ffffff;
    }
    .eyebrow {
      font-family: Inter, sans-serif;
      font-size: 30px;
      font-weight: 500;
      color: #7fd4ae;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
      max-width: 920px;
    }
    .body {
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-size: 36px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
      max-width: 900px;
    }
    .sticker-hint {
      margin-top: 36px;
      font-family: Inter, sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      border-left: 3px solid #7fd4ae;
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <img class="bg" id="bg" src="" alt="" />
    <div class="overlay"></div>
    <div class="brand">
      <img id="logo" src="" alt="" />
      <span>Guia de Bolso</span>
    </div>
    <div class="content">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="title" id="title"></h1>
      <p class="body" id="body"></p>
      <p class="sticker-hint" id="hint"></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('bg').src = params.get('bg') || '';
    document.getElementById('logo').src = params.get('logo') || '';
    document.getElementById('eyebrow').textContent = params.get('eyebrow') || '';
    document.getElementById('title').textContent = params.get('title') || '';
    document.getElementById('body').textContent = params.get('body') || '';
    const hint = params.get('hint') || '';
    const hintEl = document.getElementById('hint');
    if (hint) hintEl.textContent = hint;
    else hintEl.style.display = 'none';
    if (!params.get('eyebrow')) document.getElementById('eyebrow').style.display = 'none';
  </script>
</body>
</html>
