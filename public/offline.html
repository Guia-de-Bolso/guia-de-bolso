<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a4a3a" />
    <title>Sem conexão — Guia de Bolso</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f0f4f3;
        color: #1a2e28;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        color: #1a4a3a;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #5a6b66;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border-radius: 0.85rem;
        background: #1a4a3a;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>
        Abra <strong>Favoritos</strong> quando estiver online pelo menos uma vez. Depois, seus
        lugares e trilhas salvos ficam disponíveis mesmo sem sinal.
      </p>
      <a href="/favoritos">Ir para Favoritos</a>
    </main>
  </body>
</html>
